# 설명 계층(LLM)을 켜는 선택 override.
#
# 별도 파일인 이유는 `compose.public-data.yaml` 과 같다. compose 의 `secrets:`
# 항목은 파일이 실제로 있어야 하므로, 이것을 `compose.yaml` 에 넣으면 키가 없는
# 사람은 `docker compose up` 자체가 실패한다. 설명은 있으면 좋고 없어도 되는
# 기능이라, 없는 쪽이 기본이어야 한다.
#
# 켜서 띄우기:
#   docker compose -f compose.yaml -f compose.gemini.yaml --env-file .env.docker up -d
#
# 이 override 없이 띄우면 `FINSHIELD_LLM_PROVIDER` 가 비어 있어 계층이 꺼지고,
# `POST /api/v1/analyze/explanation` 은 200 + `available: false` 를 돌려준다.
# 판정 경로(`POST /api/v1/analyze`)는 영향을 받지 않는다.
#
# 모델 이름은 여기에 없다. 코드(`app/services/llm/runtime.py`)에 박혀 있고, 그
# 이유는 `docs/34-llm-explanation-runtime.md` 2절에 있다.
services:
  backend:
    environment:
      FINSHIELD_LLM_PROVIDER: google_ai_studio
      # 환경변수가 아니라 파일로 받는다. 값으로 주면 `docker inspect` 와
      # 프로세스 목록에 키가 남는다.
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
    secrets:
      - gemini_api_key

secrets:
  gemini_api_key:
    file: ./secrets/gemini_api_key.txt
