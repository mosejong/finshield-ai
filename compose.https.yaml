services:
  backend:
    environment:
      APP_ENV: production
      FINSHIELD_TRUSTED_HOSTS: backend,localhost,127.0.0.1
      # 경로는 Caddy -> web -> backend 다. Caddy 가 X-Forwarded-For 를 실제
      # 접속 주소 하나로 덮어쓰고(deploy/Caddyfile), web 은 그 값을 그대로
      # 넘기며 자기 홉을 덧붙이지 않는다. 그래서 맨 오른쪽 = 실제 클라이언트다.
      # 앞단에 CDN 같은 프록시를 하나 더 두면 이 값도 함께 올려야 한다.
      FINSHIELD_TRUSTED_PROXY_HOPS: "1"

  # backend 와 같은 APP_ENV 여야 한다. 여기가 development 로 남으면 정리
  # 컨테이너만 SQLite 를 허용하게 되고, 그러면 운영 DB 가 아닌 곳을 비운다.
  retention:
    environment:
      APP_ENV: production

  web:
    environment:
      FINSHIELD_ALLOWED_ORIGINS: https://${FINSHIELD_DOMAIN:?FINSHIELD_DOMAIN is required}

  proxy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      FINSHIELD_DOMAIN: ${FINSHIELD_DOMAIN:?FINSHIELD_DOMAIN is required}
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  caddy-data:
  caddy-config:
