services:
  backend:
    environment:
      APP_ENV: production
      FINSHIELD_TRUSTED_HOSTS: backend,localhost,127.0.0.1

  web:
    environment:
      FINSHIELD_ALLOWED_ORIGINS: https://${FINSHIELD_DOMAIN:?FINSHIELD_DOMAIN is required}

  proxy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      FINSHIELD_DOMAIN: ${FINSHIELD_DOMAIN:?FINSHIELD_DOMAIN is required}
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  caddy-data:
  caddy-config:
