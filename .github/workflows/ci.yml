name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # 타입 생성이 빌드에 포함되므로 build 를 먼저 돌린다
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  container-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "cryptography>=45.0,<47.0"
      - run: python scripts/create_local_docker_secrets.py
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up --detach
      - run: python scripts/verify_compose_runtime.py
      - if: always()
        run: docker compose ps && docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down --volumes --remove-orphans
