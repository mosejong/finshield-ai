name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pytest -q

  # lock 이 원본(.in)과 어긋난 채 병합되는 것을 막는다.
  # --upgrade 없이 재컴파일하면 기존 pin 을 유지하므로, 상류에 새 버전이
  # 나왔다는 이유로는 실패하지 않는다. .in 을 고치고 lock 을 갱신하지 않은
  # 경우에만 diff 가 생긴다.
  deps-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: >-
          uv pip compile requirements.in --universal --generate-hashes
          --python-version 3.12 -o requirements.txt
      - run: >-
          uv pip compile requirements-dev.in --universal --generate-hashes
          --python-version 3.12 -o requirements-dev.txt
      - name: lock 이 requirements.in 과 일치하는지 확인
        run: git diff --exit-code -- requirements.txt requirements-dev.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # 타입 생성이 빌드에 포함되므로 build 를 먼저 돌린다
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  container-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # secrets 생성 스크립트는 cryptography 만 쓰지만, 범위 지정으로 따로
      # 설치하면 이 job 만 lock 밖의 버전을 쓰게 된다. 런타임 lock 을 그대로 쓴다.
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python scripts/create_local_docker_secrets.py
      - run: docker compose config --quiet
      - run: FINSHIELD_DOMAIN=finshield.example.com docker compose -f compose.yaml -f compose.https.yaml config --quiet
      - run: >-
          docker run --rm
          -e FINSHIELD_DOMAIN=finshield.example.com
          -v "${{ github.workspace }}/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
          caddy validate --config /etc/caddy/Caddyfile
      - run: docker compose build
      # APP_ENV 가 development 라 rate limit 은 기본으로 꺼져 있다. 이 job 은
      # 컨테이너에서 429 가 실제로 나오는지를 확인하는 자리이므로 켜서 띄운다.
      #
      # 정리 주기는 기본 1시간이다. 그대로 두면 "스케줄에 따라 실제로 지워진다"
      # 를 CI 시간 안에 확인할 수 없어 60초로 줄인다.
      - run: >-
          FINSHIELD_RATE_LIMIT_ENABLED=1
          FINSHIELD_RETENTION_INTERVAL_SECONDS=60
          docker compose up --detach
      # 스크립트도 같은 주기를 알아야 얼마나 기다릴지 정할 수 있다.
      - run: FINSHIELD_RETENTION_INTERVAL_SECONDS=60 python scripts/verify_compose_runtime.py
      - if: always()
        run: docker compose ps && docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down --volumes --remove-orphans
