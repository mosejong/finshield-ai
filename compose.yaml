name: finshield

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-2592000}
  DATABASE_HOST: db
  DATABASE_PORT: "5432"
  DATABASE_NAME: ${POSTGRES_DB:-finshield}
  DATABASE_USER: ${POSTGRES_USER:-finshield_app}
  DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
  PROFILE_ENCRYPTION_KEYS_FILE: /run/secrets/profile_encryption_keys
  FINSHIELD_TRUSTED_HOSTS: ${FINSHIELD_TRUSTED_HOSTS:-backend,localhost,127.0.0.1}
  # 이 파일만으로 띄우면 proxy 가 없다. 브라우저가 web:3000 에 바로 붙으므로
  # 믿을 forwarded 홉이 없다. HTTPS 배포는 compose.https.yaml 에서 1 로 올린다.
  FINSHIELD_TRUSTED_PROXY_HOPS: ${FINSHIELD_TRUSTED_PROXY_HOPS:-0}
  # 비워두면 APP_ENV 를 따른다 (development/test 는 끔, 나머지는 켬).
  # 로컬에서 429 를 실제로 확인하거나 CI 실기동 검증을 돌릴 때 1 로 준다.
  FINSHIELD_RATE_LIMIT_ENABLED: ${FINSHIELD_RATE_LIMIT_ENABLED:-}
  FINSHIELD_RATE_LIMIT_SECRET_FILE: /run/secrets/rate_limit_secret
  FINSHIELD_MAX_REQUEST_BYTES: ${FINSHIELD_MAX_REQUEST_BYTES:-131072}

x-backend-secrets: &backend-secrets
  - postgres_password
  - profile_encryption_keys
  - rate_limit_secret

x-runtime-security: &runtime-security
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finshield}
      POSTGRES_USER: ${POSTGRES_USER:-finshield_app}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  migration:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *backend-environment
    secrets: *backend-secrets
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    <<: *runtime-security

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *backend-environment
    secrets: *backend-secrets
    depends_on:
      migration:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18000}:8000"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    <<: *runtime-security

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      FINSHIELD_API_URL: http://backend:8000
      FINSHIELD_ALLOWED_ORIGINS: http://127.0.0.1:${WEB_PORT:-13000},http://localhost:${WEB_PORT:-13000}
      # backend 와 같은 값을 준다. web 이 인터넷에 노출된 쪽이라 본문은 여기서
      # 먼저 끊긴다. 한쪽만 올리면 정상 요청이 web 에서 막히거나, backend 가
      # 어차피 거부할 본문을 web 이 통째로 메모리에 담는다.
      FINSHIELD_MAX_REQUEST_BYTES: ${FINSHIELD_MAX_REQUEST_BYTES:-131072}
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-13000}:3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    <<: *runtime-security

volumes:
  postgres-data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  profile_encryption_keys:
    file: ./secrets/profile_encryption_keys.txt
  rate_limit_secret:
    file: ./secrets/rate_limit_secret.txt
