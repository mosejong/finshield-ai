name: finshield

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-2592000}
  DATABASE_HOST: db
  DATABASE_PORT: "5432"
  DATABASE_NAME: ${POSTGRES_DB:-finshield}
  DATABASE_USER: ${POSTGRES_USER:-finshield_app}
  DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
  PROFILE_ENCRYPTION_KEYS_FILE: /run/secrets/profile_encryption_keys

x-backend-secrets: &backend-secrets
  - postgres_password
  - profile_encryption_keys

x-runtime-security: &runtime-security
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finshield}
      POSTGRES_USER: ${POSTGRES_USER:-finshield_app}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  migration:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *backend-environment
    secrets: *backend-secrets
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    <<: *runtime-security

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *backend-environment
    secrets: *backend-secrets
    depends_on:
      migration:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-18000}:8000"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    <<: *runtime-security

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      FINSHIELD_API_URL: http://backend:8000
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-13000}:3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    <<: *runtime-security

volumes:
  postgres-data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  profile_encryption_keys:
    file: ./secrets/profile_encryption_keys.txt
